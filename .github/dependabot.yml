version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    ignore:
      # typescript-eslint peers typescript <6.1.0; lift when it supports newer
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # vsce refuses @types/vscode newer than engines.vscode; raise both together
      - dependency-name: "@types/vscode"
        versions: [">=1.97.0"]
      # runtime floor is Node 18 (cli/mcp engines) and VS Code 1.96's Node 20
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/cli"
    schedule: { interval: "weekly" }
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule: { interval: "weekly" }
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
