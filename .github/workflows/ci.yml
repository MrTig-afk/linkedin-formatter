# CI - lint, the headless unit suite (~640 tests, ~1s), and the esbuild
# bundle. Integration/mcp suites are morning-only and stay out of CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        if: always()
        run: npm run test:unit

      - name: Build
        if: always()
        run: npm run build

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.173.0@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Rulesets are PINNED, never `--config auto`: auto resolves the
      # registry at run time, so a green main can go red with no code
      # change - disqualifying for a required check.
      - run: >
          semgrep scan --error
          --config p/typescript
          --config p/javascript
          --config p/secrets
